# =====================================================================
#  UConn FSAE CT-17 EV — the car file
#    base:        the chassis is the CT-17 IC's (cars/ct17_ic/vehicle.yaml); `vehicle:` below lists
#                 only what is different on the EV. Same keys and units as the IC file.
#    powertrain:  motor, inverter, reduction, differential, regen, LV, strategy (lapsim/config/schema_ev.py)
#    pack:        the accumulator: topology, cell model, thermal model, limits
#
#  Status of each value (lapsim register, and the website's input status):
#    PLACEHOLDER  = listed here, not yet in `confirmed`  -> an estimate, replace it
#    confirmed    = listed here AND named in `confirmed` -> a real CT-17EV value
#    inherited    = not listed here                      -> the CT-17IC value
#  When you enter a real value, add its dotted key to the `confirmed` list of its section, e.g.
#    confirmed: [mass.mass_no_driver]                (top level: the vehicle section)
#    powertrain: confirmed: [motor.peak_torque]
#  EVERY powertrain and pack value is a PLACEHOLDER (a generic single-motor rear-drive FSAE EV) until
#  confirmed: lap times and energies from placeholders show the SHAPE of the outputs, not the car.
#  Values may be SI numbers or strings with units ("240 kg", "230 N*m", "80 kW", "14 mOhm", "4.2 Ah").
# =====================================================================
name: CT17EV
kind: ev
base: ../ct17_ic/vehicle.yaml
confirmed: []

vehicle:
  mass:
    mass_no_driver: 240 kg            # PLACEHOLDER  EV with accumulator (IC car: 211.4 kg)
    front_weight_fraction: 0.47       # PLACEHOLDER  with driver (IC: 0.53)
    left_weight_fraction: 0.50        # PLACEHOLDER
    cg_height: 11.5 in                # PLACEHOLDER  (IC: 11 in, physical test)

  powertrain:
    kind: EV

  brakes:
    front_bias: 0.60                  # PLACEHOLDER  hydraulic bias (regen is added on the rear axle, see powertrain.regen)

  events:                             # best times of the EV class for scoring; null = that event is not scored
    endurance_track: ../../tracks/michigan_2026/endurance_2026_backstretch.csv   # PLACEHOLDER: IC tracks until the EV tracks are surveyed
    tmin_accel: null                  # MISSING  EV class best time at the competition you simulate
    tmin_skidpad: null                # MISSING
    tmin_autocross: null              # MISSING
    tmin_endurance: null              # MISSING

  # Add any other section that differs from the IC car (same keys as the IC car file):
  #   geometry:  wheelbase, track_front, track_rear
  #   tires:     pressures, compound
  #   front: / rear:  springs, ARBs, hardpoint_file (relative to this file), ride_height ...
  #   aero:      calib_ClA, calib_CdA, components (if the EV runs a different package)

powertrain:
  confirmed: []

  motor:
    name: PLACEHOLDER axial-flux PMSM
    peak_torque: 230                  # N m at the shaft (short-time rating)
    continuous_torque: 120            # N m (thermal check only: rms torque over the endurance)
    peak_power: 100 kW                # mechanical; the 80 kW accumulator limit usually binds first
    max_rpm: 6500                     # mechanical / inverter speed limit
    corner_rpm: 4500                  # speed up to which peak torque is available AT rated_voltage
    rated_voltage: 520                # V dc for corner_rpm; the corner speed scales with pack voltage (sag, SOC)
    kt: 0.60                          # N m per A rms phase current (torque constant)
    phase_resistance: 12 mOhm         # per phase at 20 degC -> copper loss 3 I^2 R
    iron_loss_1: 1.2                  # W per rad/s  (hysteresis + bearing friction)
    iron_loss_2: 0.0035               # W per (rad/s)^2 (eddy currents + windage)
    rotor_inertia: 0.042              # kg m^2
    torque_curve_file: null           # optional .csv (rpm, torque_Nm) of the peak-torque envelope; replaces peak_torque/corner_rpm
    # lumped winding temperature (copper + iron loss -> thermal mass -> coolant)
    thermal_mass: 6000                # J/K
    ua_coolant: 60                    # W/K winding to coolant
    coolant_temp: 40                  # degC
    start_temp: 40                    # degC at the start of a run
    derate_start_temp: 110            # degC torque derating starts ...
    derate_end_temp: 130              # ... and reaches zero torque

  inverter:
    name: PLACEHOLDER
    max_phase_current: 400            # A rms -> torque limit kt * I
    max_dc_current: 250               # A dc
    min_dc_voltage: 300               # V dc under-voltage limit
    loss_const: 150                   # W switching + control, whenever enabled
    loss_per_amp: 2.2                 # W per A rms phase current (conduction)

  accumulator:
    start_soc: 0.98                   # at the start of each event
    soc_min: 0.05                     # the simulation flags the lap where SOC falls below this
    start_temp: 25                    # degC cell temperature at the start
    sag_branches: r0+r1               # resistance used for the instantaneous power limit: 'r0', 'r0+r1' or 'r0+r1+r2'

  drivetrain:
    type: chain                       # 'chain' or 'gear' (text only; the losses are in `efficiency`)
    front_sprocket: 12                # teeth (motor)  -> ratio = rear / front
    rear_sprocket: 42                 # teeth (differential)
    ratio: null                       # give the overall ratio directly instead of sprockets (gearbox)
    efficiency: 0.96                  # motor shaft -> wheels (chain, diff, CV joints, bearings)
    inertia: 0.03                     # kg m^2 at the axle: rear sprocket + diff + halfshafts
    ratio_options: [3.0, 3.25, 3.5, 3.75, 4.0, 4.25]   # for the gearing sweep

  differential:                       # same model as the IC car (lapsim.subsystems.driveline.Differential)
    type: drexler                     # 'drexler' | 'open' | 'spool' | 'ideal'
    preload: 43                       # N m
    drive_ramp_deg: 60
    coast_ramp_deg: 45
    lockup_at_45deg: 0.51

  wheels:
    rolling_radius_factor: 0.975      # effective rolling radius / unloaded radius (IC car value)
    rear_corner_inertia: 0.20         # kg m^2
    front_corner_inertia: 0.18        # kg m^2
    slip_stiffness_per_load: 25       # tire longitudinal slip stiffness / Fz

  regen:
    enabled: true
    max_torque: 80                    # N m at the motor shaft
    max_power: 30 kW                  # into the accumulator (the cells' charge-current limit also applies)
    min_speed: 5 kph                  # no regen below this ...
    fade_speed: 15 kph                # ... full regen above this
    rear_brake_share: 1.0             # share of the REAR axle's braking force the motor may supply (blended with friction brakes)
    max_soc: 0.97                     # no regen above this SOC

  lv:
    aux_power: 350                    # W taken from the accumulator through the DC/DC: pumps, fans, controllers
    dcdc_efficiency: 0.90

  strategy:
    power_limit: null                 # kW at the accumulator; null = pack.limits.max_power (rules, 80 kW)
    endurance_power_limit: null       # kW for the endurance only; null = same as power_limit
    torque_limit: null                # N m driver torque map limit; null = motor peak
    max_speed: null                   # speed limiter

  endurance:
    driver_change_s: 180              # tractive system idle at half distance

  scoring:
    # FSAE efficiency: EF = (Tmin/T) * (Emin/E) per lap. ASSUMED constants - check the rules year.
    energy_min_per_lap: null          # kWh per lap of the most efficient EV team; null = efficiency not scored
    t_min_lap: null                   # s; null -> events.tmin_endurance / laps
    ef_min: 0.10
    ef_max: 0.85

# 140s4p 21700 NMC (Molicel P42A class), 7 segments of 20s, ~588 V max, 16.8 Ah.
# CHECK the limits against the CURRENT rulebook and the cell datasheet.
pack:
  pack:
    series: 140
    parallel: 4
    segments: 7                        # 20 groups each: 84 V, ~4.5 MJ (5 x 28 would be 6.3 MJ > 6 MJ)
    interconnect_resistance: 30 mOhm   # busbars, fuses, contactors, MSD

  cell:
    chemistry: nmc                     # nmc | lfp (preset OCV + equivalent circuit)
    capacity_ah: 4.2                   # per physical cell
    r0: 14 mOhm                        # per physical cell at t_ref
    r1: 6 mOhm
    tau1: 5
    r2: 8 mOhm
    tau2: 80
    t_ref: 25
    v_min: 2.5
    v_max: 4.2

  thermal:
    ambient: 25                        # degC air / coolant temperature
    cell_mass: 0.068                   # kg per cell
    cell_cp: 1000                      # J/(kg K)
    r_core_surface: 2.0                # K/W per cell
    r_surface_ambient: 15.0            # K/W per cell (air cooled; much lower with a cold plate)

  limits:                              # CHECK AGAINST THE CURRENT RULEBOOK AND DATASHEET
    max_power: 80 kW
    cell_t_max: 60                     # degC
    cell_t_derate: 50                  # degC
    cell_t_min_charge: 0               # degC
    i_dis_peak: 45 A
    i_chg_peak: 8.4 A
