[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapsim"
version = "1.0.0"
description = "Predictive lap simulation of the UConn Formula SAE cars (CT-17 IC and CT-17 EV)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipywidgets>=8", "matplotlib"]
dev = ["pytest>=8", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
lapsim = "lapsim.cli:main"

[tool.setuptools.packages.find]
include = ["lapsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long runs (full events, transient check, notebooks)"]
